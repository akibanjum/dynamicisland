<!DOCTYPE html>
<html lang="en" data-t="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0a24">
<title>A little letter for you ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500;1,600&family=DM+Sans:wght@400;500;700&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root{--a:#ff7eb3;--a2:#e5195f;--on:#fff;--s1:#060a26;--s2:#1b1156;--tx:#f4f0ff;--tx2:rgba(255,255,255,.65);--line:rgba(255,255,255,.18);--fill:rgba(255,255,255,.08);--fld:rgba(0,0,0,.35);--glass:rgba(10,8,38,.62);--ov:rgba(5,4,20,.88);--err:#ffb3a7;--serif:"Cormorant Garamond","Noto Serif Bengali",Georgia,serif;--sans:"DM Sans","Hind Siliguri",system-ui,sans-serif}
[data-t=sunset]{--a:#ffd08a;--a2:#ff7a45;--on:#2a0f05;--s1:#3a1450;--s2:#d4502f;--glass:rgba(34,10,40,.55);--ov:rgba(30,8,30,.88)}
[data-t=aurora]{--a:#6dffc1;--a2:#18c795;--on:#02201a;--s1:#04141c;--s2:#0a4a45;--glass:rgba(3,25,28,.6);--ov:rgba(2,16,20,.9)}
[data-t=sakura]{--a:#e5457f;--a2:#c2185b;--on:#fff;--s1:#ffeef4;--s2:#ffc9dc;--tx:#4a1630;--tx2:rgba(74,22,48,.72);--line:rgba(74,22,48,.2);--fill:rgba(74,22,48,.06);--fld:rgba(255,255,255,.75);--glass:rgba(255,255,255,.66);--ov:rgba(255,238,244,.92);--err:#c0392b}
[data-t=royal]{--a:#f2c46d;--a2:#c8921f;--on:#1a1203;--s1:#07060a;--s2:#2a1f09;--glass:rgba(14,11,6,.66);--ov:rgba(5,4,2,.9)}
[data-t=ocean]{--a:#7ae7ff;--a2:#1fa2c9;--on:#031a22;--s1:#021a2b;--s2:#065a73;--glass:rgba(2,26,40,.6);--ov:rgba(1,14,24,.9)}
[data-t=forest]{--a:#b6f06b;--a2:#5aa63a;--on:#0c1a06;--s1:#04100a;--s2:#123a1f;--glass:rgba(4,22,12,.6);--ov:rgba(2,12,6,.9)}
[data-t=winter]{--a:#bfe3ff;--a2:#5fa8e8;--on:#06182b;--s1:#0c1830;--s2:#3a557f;--glass:rgba(12,22,45,.55);--ov:rgba(6,12,28,.9)}
[data-t=monsoon]{--a:#ffcf70;--a2:#e08a1e;--on:#1a1003;--s1:#0c1218;--s2:#2b3a4a;--glass:rgba(12,18,26,.62);--ov:rgba(6,10,15,.9)}
[data-t=galaxy]{--a:#d9a0ff;--a2:#9b3dff;--on:#12002a;--s1:#0a0220;--s2:#3a0a5e;--glass:rgba(18,6,40,.6);--ov:rgba(8,2,22,.9)}
[data-t=rose]{--a:#c8173f;--a2:#9e0f32;--on:#fff;--s1:#fff1f2;--s2:#ffd3d9;--tx:rgb(74,15,28);--tx2:rgba(74,15,28,.72);--line:rgba(74,15,28,.2);--fill:rgba(74,15,28,.06);--fld:rgba(255,255,255,.75);--glass:rgba(255,255,255,.66);--ov:rgba(255,241,242,.92);--err:#b3261e}
[data-t=cotton]{--a:#ff5fa2;--a2:#b05cff;--on:#fff;--s1:#ffeaf6;--s2:#dcd0ff;--tx:rgb(61,26,77);--tx2:rgba(61,26,77,.72);--line:rgba(61,26,77,.2);--fill:rgba(61,26,77,.06);--fld:rgba(255,255,255,.75);--glass:rgba(255,255,255,.66);--ov:rgba(255,236,248,.92);--err:#b3261e}
[data-t=lavender]{--a:#8a5cf6;--a2:#6a3fd1;--on:#fff;--s1:#f3eeff;--s2:#cdbcff;--tx:rgb(47,31,90);--tx2:rgba(47,31,90,.72);--line:rgba(47,31,90,.2);--fill:rgba(47,31,90,.06);--fld:rgba(255,255,255,.75);--glass:rgba(255,255,255,.66);--ov:rgba(243,238,255,.92);--err:#b3261e}
[data-t=peach]{--a:#f2704a;--a2:#d94a2a;--on:#fff;--s1:#fff4e6;--s2:#ffcfae;--tx:rgb(74,34,16);--tx2:rgba(74,34,16,.72);--line:rgba(74,34,16,.2);--fill:rgba(74,34,16,.06);--fld:rgba(255,255,255,.75);--glass:rgba(255,255,255,.66);--ov:rgba(255,244,230,.92);--err:#b3261e}
[data-t=valentine]{--a:#ff6b8b;--a2:#d81b4f;--on:#fff;--s1:#2a0610;--s2:#8c1230;--glass:rgba(40,6,16,.55);--ov:rgba(30,4,12,.9)}
[data-t=sunset] .moon{top:auto;bottom:16vh;right:50%;margin-right:-60px;width:120px;height:120px;background:radial-gradient(circle,#fff2c2,#ffb347 60%,#ff7a45);box-shadow:0 0 90px 30px rgba(255,150,70,.5)}
[data-t=aurora] .moon,[data-t=sakura] .moon,[data-t=ocean] .moon,[data-t=monsoon] .moon,[data-t=rose] .moon,[data-t=cotton] .moon,[data-t=lavender] .moon,[data-t=peach] .moon,[data-t=valentine] .moon{display:none}
[data-t=galaxy] .moon{background:radial-gradient(circle at 35% 35%,#f0c8ff,#8a3fd6 70%);box-shadow:0 0 60px 10px rgba(180,90,255,.45)}
[data-t=royal] .moon{background:radial-gradient(circle at 35% 35%,#fff4d0,#e8c46a 70%);box-shadow:0 0 50px 8px rgba(242,196,109,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;display:grid;place-items:center;padding:18px;font-family:var(--sans);color:var(--tx);overflow-x:hidden;background:linear-gradient(170deg,var(--s1) 20%,var(--s2) 100%) fixed}
html[lang=bn] *{font-style:normal!important}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.moon{position:fixed;top:5vh;right:7vw;width:64px;height:64px;border-radius:50%;z-index:0;background:radial-gradient(circle at 35% 35%,#fffbe8,#e9dfb8 70%);box-shadow:0 0 50px 8px rgba(255,248,210,.35)}
.moon:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 40%,transparent 0 55%,var(--s1) 56%);opacity:.0}
main,.overlay{position:relative;z-index:2}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.hidden{display:none!important}
.glass{width:min(480px,100%);padding:28px 22px;border-radius:24px;background:var(--glass);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.45);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
h1,h2{font-family:var(--serif);font-weight:600;font-style:italic;color:var(--tx);text-shadow:0 0 24px color-mix(in srgb,var(--a) 55%,transparent)}
.gen h1{font-size:34px;line-height:1.1}.sub{margin:6px 0 18px;font-size:14px;color:var(--tx2)}
.field{display:block;margin-bottom:12px}.field>span,.lbl{display:block;margin-bottom:5px;font-size:13px;color:var(--a)}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--fld);outline:none}
.field textarea{height:96px;resize:vertical;line-height:1.5}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--a)}
.field option{background:var(--s1);color:var(--tx)}.field small{display:block;margin-top:4px;font-size:12px;color:var(--tx2)}
.row{display:flex;gap:8px}.row>:first-child{width:46%}.row>:last-child{width:54%}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}.tile{display:flex;flex-direction:column;gap:5px;align-items:center;background:none;color:var(--tx);font-size:11px}.tile i{position:relative;display:block;width:100%;aspect-ratio:1;border-radius:14px;background:linear-gradient(160deg,var(--g1),var(--g2));border:2px solid var(--line)}.tile i:after{content:"";position:absolute;right:7px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.tile.on i{border-color:var(--a);transform:scale(1.06)}
.err{min-height:18px;margin-bottom:8px;font-size:13px;color:var(--err)}
.btn,.main{display:block;width:100%;padding:13px 20px;border-radius:999px;font-weight:700;text-align:center;text-decoration:none;color:var(--on);background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 8px 22px color-mix(in srgb,var(--a2) 45%,transparent);transition:transform .2s}
.btn:active,.main:active{transform:scale(.97)}
.ghost{margin-top:10px;color:var(--tx);background:var(--fill);box-shadow:none;border:1px solid var(--line)}
.result{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.result input{width:100%;padding:11px 13px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--fld);font-size:13px;color:var(--tx)}
.btns{display:flex;gap:8px}.btns>*{flex:1;margin:0}

.stage{width:min(560px,100%)}
.step{display:none;text-align:center}.step.on{display:block;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.step h1{font-size:clamp(40px,10vw,60px);line-height:1;margin-bottom:12px}
.step h2{font-size:clamp(30px,7.4vw,40px);line-height:1.15;margin-bottom:14px}
.step p.t{margin-bottom:22px;color:var(--tx2);line-height:1.6}
.moonbtn{margin:6px auto 22px;width:84px;height:84px;border-radius:50%;font-size:34px;background:radial-gradient(circle at 35% 30%,#fff7d6,var(--a));box-shadow:0 0 0 8px var(--fill),0 0 40px var(--a);animation:glow 2.4s ease-in-out infinite}
.msg{min-height:130px;margin:6px auto 22px;font:italic 500 clamp(20px,4.8vw,24px)/1.6 var(--serif);white-space:pre-line}
.caret{display:inline-block;width:2px;height:1em;margin-left:2px;vertical-align:-2px;background:var(--a);animation:blink .8s steps(1) infinite}
.later{opacity:0;pointer-events:none;transition:opacity .8s}.later.show{opacity:1;pointer-events:auto}
.rs{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;text-align:left}
.rs button{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--fill);border:1px solid var(--line);font:500 19px/1.35 var(--serif);text-align:left;transition:background .4s,border-color .4s}
.rs button i{font-style:normal;color:var(--a);font-size:20px;text-shadow:0 0 12px var(--a)}
.rs button span{filter:blur(7px);transition:filter .6s;user-select:none}
.rs button.seen{background:color-mix(in srgb,var(--a) 14%,transparent);border-color:var(--a)}.rs button.seen span{filter:none}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0 10px}
.opts button{padding:13px 16px;border-radius:14px;background:var(--fill);border:1px solid var(--line);font-weight:500;color:var(--tx)}
.opts button:hover{border-color:var(--a)}.opts button.bad{opacity:.35;animation:shake .35s}.opts button.good{background:color-mix(in srgb,var(--a) 30%,transparent);border-color:var(--a)}
.fb{min-height:24px;color:var(--a)}.prog{font-size:13px;color:var(--tx2)}
.choices{display:flex;justify-content:center;gap:12px;min-height:56px;align-items:center;margin-top:20px}
.yes{padding:13px 32px;border-radius:999px;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 8px 22px color-mix(in srgb,var(--a2) 50%,transparent);transition:transform .25s}
.no{padding:13px 24px;border-radius:999px;font-weight:700;background:var(--line);color:var(--tx);border:1px solid var(--line);transition:left .25s cubic-bezier(.2,.8,.2,1),top .25s cubic-bezier(.2,.8,.2,1)}
.no.run{position:fixed;z-index:60}
.reacts{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}.reacts button{width:40px;height:40px;border-radius:50%;font-size:18px;background:var(--fill);transition:transform .2s}.reacts button:hover{transform:scale(1.18)}

.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:var(--ov);backdrop-filter:blur(8px);overflow:auto}
.overlay.show{display:grid}.win{text-align:center;animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.win .big{font-size:54px;animation:beat 1.6s ease-in-out infinite}.win h2{font-size:clamp(38px,9vw,50px);margin:6px 0 12px}
.win p.f{min-height:60px;font:italic 500 21px/1.5 var(--serif);white-space:pre-line}
.date{margin-top:16px}.date .btns{margin-top:0}.date .btn{padding:11px;font-size:14px}
.reply{margin-top:16px;display:flex;flex-direction:column;gap:10px}.reply textarea{width:100%;height:80px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--fld);resize:none;outline:none}
.wa{padding:12px;border-radius:999px;font-weight:700;background:#1fb860;color:#fff}
.sig{margin-top:14px;font:italic 500 18px var(--serif);color:var(--tx2)}
.banner{position:fixed;top:0;left:0;right:0;z-index:70;padding:9px 14px;text-align:center;font-size:13px;background:var(--a);color:var(--on)}.banner a{color:inherit;font-weight:700;margin-left:6px}
.fx{position:fixed;pointer-events:none;z-index:5;animation:up linear forwards}
@keyframes up{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.85}100%{transform:translateY(-112vh) translateX(var(--sx,0)) rotate(300deg);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 0 14px var(--fill),0 0 60px var(--a)}}
@keyframes blink{50%{opacity:0}}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes beat{0%,100%{transform:scale(1)}20%{transform:scale(1.14)}40%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="sky"></canvas><div class="moon"></div>

<main class="glass gen" id="gen">
  <h1>Write a love letter</h1>
  <p class="sub">Fill this in and you’ll get a private link to send.</p>
  <label class="field"><span>Their name</span><input id="to" placeholder="e.g. Maya" autocomplete="off"></label>
  <label class="field"><span>Your name</span><input id="from" placeholder="e.g. Rafi" autocomplete="off"></label>
  <div class="field"><span>Your WhatsApp number (their reply comes here)</span><div class="row"><select id="cc" aria-label="Country code"></select><input id="wa" type="tel" inputmode="tel" placeholder="1700000000"></div></div>
  <div class="field"><span>Language of the letter</span><select id="lang"><option value="en">English</option><option value="bn">বাংলা (Bangla)</option></select></div>
  <span class="lbl">Theme</span>
  <div class="sw" id="sw"></div>
  <label class="field"><span>The question</span><input id="q" placeholder="Will you be mine forever? 💍"></label>
  <label class="field"><span>Your message (empty = default)</span><textarea id="msg" placeholder="Write from the heart…"></textarea></label>
  <label class="field"><span>Reasons I love you (optional)</span><textarea id="rs" placeholder="One reason per line"></textarea></label>
  <label class="field"><span>Mini quiz (optional)</span><textarea id="zs" placeholder="One question per line:&#10;Where did we first meet? | At school | Online | At a party"></textarea><small>Format: question | right answer | wrong answer | wrong answer</small></label>
  <div class="field"><span>Save the date (optional)</span><div class="row"><input id="d" type="date" aria-label="Date"><input id="dt" placeholder="Title e.g. Our first date"></div></div>
  <p class="err" id="err" role="alert"></p>
  <button class="btn" id="make">Create my link</button>
  <button class="btn ghost" id="demo" type="button">See a demo first</button>
  <div class="result hidden" id="result"><input id="url" readonly aria-label="Your link"><small id="len" style="display:block;margin:-4px 0 10px;color:var(--tx2)"></small><div class="btns"><button class="btn" id="copy">Copy link</button><a class="btn ghost" id="preview" target="_blank" rel="noopener">Open</a></div></div>
</main>

<main class="stage hidden" id="stage">
  <section class="glass step on" id="s0"><div class="moonbtn" style="display:grid;place-items:center">✦</div><h1 id="hello"></h1><p class="t" id="intro"></p><button class="main" id="open"></button></section>
  <section class="glass step" id="s1"><p class="msg"><span id="typed"></span><span class="caret" id="caret"></span></p><button class="main later" id="c1"></button></section>
  <section class="glass step" id="s2"><h2 id="whyT"></h2><p class="t" id="whyH"></p><div class="rs" id="rs2"></div><button class="main later" id="c2"></button></section>
  <section class="glass step" id="s3"><p class="prog" id="prog"></p><h2 id="qQ"></h2><div class="opts" id="opts"></div><p class="fb" id="fb"></p></section>
  <section class="glass step" id="s4"><h2 id="ask"></h2><div class="choices"><button class="yes" id="yes"></button><button class="no" id="no"></button></div><div class="reacts" id="reacts"></div></section>
</main>

<section class="overlay" id="overlay"><div class="glass win">
  <div class="big">💖</div><h2 id="winH"></h2><p class="f" id="winT"></p>
  <div class="later" id="after">
    <div class="date hidden" id="date"><div class="btns"><button class="btn" id="ics"></button><a class="btn ghost" id="gcal" target="_blank" rel="noopener"></a></div></div>
    <div class="reply"><textarea id="reTxt"></textarea><button class="wa" id="reBtn"></button></div>
    <p class="sig" id="sig"></p>
  </div>
</div></section>

<script>
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const L = {
 en: { hey: n => `Hey ${n},`, intro: "Someone left a message for you among the stars.", open: "Open your letter", cont: "Continue", why: "Reasons I love you", whyH: "Touch each star to reveal it", quiz: "How well do you know me?", qn: (i, n) => `Question ${i} of ${n}`, ok: "Right! 💖", bad: "Not quite, try again 😜", yes: "Yes ❤️", no: "No", win: "I knew it!", fin: "Our forever begins today 🥰\nI love you today, tomorrow and always ♾️", save: "Save the date", gcal: "Google Calendar", ph: "Want to say something back? 💭", wa: "Send on WhatsApp", sig: "Yours always 🫶", dtt: "Our day ❤️", sent: "I said YES! 🥹", from: n => `From ${n}`, demoOnly: "Demo only, nothing sent",
  dq: "Will you be mine forever? 💍",
  dm: "Out of all the souls in this endless world,\nsomehow, my heart found its way to you. 🫠\n\nI don’t need a perfect life, or a life without storms.\nI just want you beside me through every season: the laughter, the tears, the chaos and the quiet moments.\n\nIf I get to grow old with you, even the simplest day becomes my favorite memory. ♾️",
  run: ["No 🙈","Are you sure? 🥺","Think again 💭","Too slow! 😂","Catch me if you can 🏃","Wrong button 😜","Nice try 🤭","One more chance? 💖","You can’t catch love 💘","Okay okay… 🥹"],
  sr: ["The way you laugh at your own jokes","You make ordinary days feel special","You stay kind even when it’s hard","Your voice is my favorite sound"],
  sz: [["What’s my favorite food?","Biryani","Pizza","Sushi"],["Where did we first meet?","Online","At school","At a party"]] },

    if (said) return; said = true; no.classList.add("hidden"); $("overlay").classList.add("show");
    burst(60); setTimeout(() => burst(30), 350);
    for (let i = 0; i < 14; i++) setTimeout(() => fx(["💖", "❤️", "💕", "✨"][i % 4], 20 + Math.random() * 20), i * 110);
    const title = c.dt || T.dtt;
    if (c.d) {
      $("date").classList.remove("hidden"); $("ics").textContent = "📅 " + T.save; $("gcal").textContent = T.gcal;
      const a = c.d.replace(/-/g, ""), n = new Date(c.d + "T00:00:00"); n.setDate(n.getDate() + 1);
      const b = n.getFullYear() + String(n.getMonth() + 1).padStart(2, "0") + String(n.getDate()).padStart(2, "0");
      $("gcal").href = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${a}/${b}`;
      $("ics").onclick = () => {
        const f = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LoveLetter//EN", "BEGIN:VEVENT", `UID:${a}-${Date.now()}@loveletter`, `DTSTAMP:${new Date().toISOString().replace(/[-:]|\.\d+/g, "")}`, `DTSTART;VALUE=DATE:${a}`, `DTEND;VALUE=DATE:${b}`, `SUMMARY:${title.replace(/[,;\n]/g, " ")}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
        const u = URL.createObjectURL(new Blob([f], { type: "text/calendar" })), l = document.createElement("a");
        l.href = u; l.download = "save-the-date.ics"; document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
      };
    }
    typeInto($("winT"), T.fin, 40, () => $("after").classList.add("show"));
  };
  $("reBtn").onclick = () => {
    if (c.demo) { $("reBtn").textContent = T.demoOnly; return; }
    const ex = $("reTxt").value.trim();
    open(`https://wa.me/${c.wa}?text=${encodeURIComponent(T.sent + (ex ? "\n\n" + ex : ""))}`, "_blank", "noopener");
  };
  if (c.demo) {
    const b = document.createElement("div"); b.className = "banner"; b.innerHTML = 'Demo preview, nothing is sent. <a href="#" id="back">Back to editor</a>'; document.body.append(b);
    $("back").onclick = e => { e.preventDefault(); clearInterval(timer); document.querySelectorAll(".banner,.fx,body > .no").forEach(n => n.remove());
      $("stage").innerHTML = SNAP.st; $("overlay").innerHTML = SNAP.ov; $("overlay").classList.remove("show"); $("stage").classList.add("hidden"); $("gen").classList.remove("hidden");
      doc.lang = "en"; doc.dataset.t = theme; document.title = "A little letter for you ❤️"; scrollTo(0, 0); };
  }
}
(async () => { try { const c = await unpack(new URLSearchParams(location.search)); if (c && c.to && c.wa) startLetter(c); } catch (e) { /* invalid link: show generator */ } })();

/* ---------- helpers ---------- */
function typeInto(el, text, speed, done) {
  el.textContent = "";
  if (reduce) { el.textContent = text; return done && done(); }
  const ch = Array.from(text); let i = 0, t, fin = false;
  const end = () => { if (fin) return; fin = true; clearTimeout(t); el.textContent = text; done && done(); };
  el.onclick = end;
  (function step() { if (fin) return; if (i >= ch.length) return end(); el.textContent += ch[i++]; t = setTimeout(step, speed); })();
}
function fx(ch, size) {
  const s = document.createElement("span"); s.className = "fx"; s.textContent = ch;
  s.style.cssText = `left:${Math.random() * 100}vw;bottom:-50px;font-size:${size}px;animation-duration:${4 + Math.random() * 3}s;--sx:${Math.random() * 120 - 60}px`;
  document.body.append(s); setTimeout(() => s.remove(), 7500);
}
function burst(n) { if (window.confetti && !reduce) confetti({ particleCount: n, spread: 75, startVelocity: 32, origin: { y: .6 }, zIndex: 80, colors: ["#ffffff", "#ffd98a", getComputedStyle(document.documentElement).getPropertyValue("--a").trim() || "#ff7eb3"] }); }
</script>
